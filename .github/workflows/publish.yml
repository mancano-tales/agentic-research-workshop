name: Publicar site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: quarto-dev/quarto-actions/setup@v2
      - name: Renderizar site e ementa (PDF/DOCX)
        # Arquivo por arquivo: os PDFs Beamer exigem LaTeX e fontes ausentes no runner.
        run: |
          for f in index.qmd materiais.qmd sobre.qmd sessions/index.qmd ementa.qmd; do
            quarto render "$f"
          done
          quarto render ementa.qmd --to typst
          quarto render ementa.qmd --to docx
      - uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
          render: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
